---
app-id: "@PROJECT_FQDN@"
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
add-build-extensions:
  org.freedesktop.Sdk.Extension.node20:
    directory: lib/sdk/node20
    version: "25.08"
    no-autodownload: true
    autodelete: false
command: sunshine
separate-locales: false
finish-args:
  - --device=all
  - --env=PULSE_PROP_media.category=Manager
  - --env=SUNSHINE_MIGRATE_CONFIG=1
  - --filesystem=home
  - --filesystem=xdg-run/pipewire-0
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --system-talk-name=org.freedesktop.Avahi
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher

cleanup:
  - /include
  - /lib/cmake
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/*.a
  - /share/man

modules:
  - modules/xvfb/xvfb.json
  - modules/nlohmann_json.json
  - modules/avahi.json
  - modules/boost.json
  - modules/libevdev.json
  - modules/miniupnpc.json
  - modules/numactl.json
  - modules/cuda.json
  - modules/ffmpeg.json
  - name: sunshine
    builddir: true
    build-options:
      append-path: /usr/lib/sdk/node20/bin
      build-args:
        - --share=network
      env:
        BUILD_VERSION: "@BUILD_VERSION@"
        BRANCH: "@GITHUB_BRANCH@"
        COMMIT: "@GITHUB_COMMIT@"
        npm_config_nodedir: /usr/lib/sdk/node20
        NPM_CONFIG_LOGLEVEL: info
    buildsystem: cmake-ninja
    config-opts:
      - -DBOOST_USE_STATIC=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_WERROR=ON
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_CUDA_COMPILER=/app/cuda/bin/nvcc
      - -DFFMPEG_PREPARED_BINARIES=/app/ffmpeg
      - -DSUNSHINE_ASSETS_DIR=share/sunshine
      - -DSUNSHINE_BUILD_FLATPAK=ON
      - -DSUNSHINE_ENABLE_CUDA=ON
      - -DSUNSHINE_ENABLE_DRM=ON
      - -DSUNSHINE_ENABLE_KWIN=ON
      - -DSUNSHINE_ENABLE_PORTAL=ON
      - -DSUNSHINE_ENABLE_VULKAN=ON
      - -DSUNSHINE_ENABLE_WAYLAND=ON
      - -DSUNSHINE_ENABLE_X11=ON
      - -DSUNSHINE_EXECUTABLE_PATH=/app/bin/sunshine
      - -DSUNSHINE_SYSTEM_VULKAN_HEADERS=ON
    post-install:
      - install -D $FLATPAK_BUILDER_BUILDDIR/packaging/linux/flatpak/scripts/* /app/bin
      - install -D $FLATPAK_BUILDER_BUILDDIR/packaging/linux/flatpak/apps.json /app/share/sunshine/apps.json
    sources:
      - type: git
        url: "@GITHUB_CLONE_URL@"
        commit: "@GITHUB_COMMIT@"
    run-tests: true
    test-commands:
      - xvfb-run tests/test_sunshine --gtest_color=yes
