# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: true

reviews:
  profile: chill
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_prs: true
  poem: false
  review_status: true
  review_details: true

  path_filters:
    - "!third-party/**"
    - "!node_modules/**"
    - "!build/**"
    - "!cmake-*/**"
    - "!docs/doxyconfig*"
    - "!**/*.log"
    - "!package-lock.json"
    - "!**/*.obj"
    - "!**/*.etl"
    - "!**/*.csv"
    - "!**/*.cat"
    - "!**/*.bmp"

  path_instructions:
    - path: "src/**/*.{cpp,c,h}"
      instructions: >
        Core C and C++ host code. Review memory safety, thread safety, RAII
        ownership, protocol correctness, and security boundaries. Account for
        platform-specific code selected by preprocessor guards.
    - path: "src/platform/**"
      instructions: >
        Windows, Linux, and macOS platform implementations. Check consistent
        behavior, operating-system API error handling, and resource release.
    - path: "cmake/**"
      instructions: >
        CMake build and packaging code. Check cross-platform behavior,
        reproducibility, dependency handling, and modern CMake practices.
    - path: "src_assets/**/*.{vue,js,html}"
      instructions: >
        Vue-based administration interfaces. Review XSS and CSRF defenses,
        component state, authentication boundaries, and accessibility.
    - path: "docker/**"
      instructions: >
        Container build definitions. Review base-image scope, layer caching,
        dependency pinning, and security.
    - path: "packaging/**"
      instructions: >
        Installer and distribution packaging. Review paths, privileges,
        upgrades, rollback behavior, and dependency declarations.
    - path: "tests/**"
      instructions: >
        Automated tests. Review boundary coverage, determinism, failure-mode
        assertions, and whether the test exercises production behavior.

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master

  tools:
    cppcheck:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: auto
